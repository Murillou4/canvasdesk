<!doctype html><html><head><meta charset="utf-8"><style>html,body,#player,video{width:100%;height:100%;margin:0;background:#111;overflow:hidden}video{object-fit:contain}</style></head><body><div id="player"></div><script>
const source=__SOURCE__, kind=__KIND__;let player,desired={},pendingUntil=0,remoteSeekUntil=0,revision=-1,lastPosition=0,lastSample=Date.now();
function report(kind,extra={}){if(window.cefQuery)cefQuery({request:JSON.stringify({kind,...extra}),onSuccess:()=>{},onFailure:()=>{}})}
function position(){return kind==='youtube'?(player?.getCurrentTime?.()||0):(player?.currentTime||0)}
function action(action){if(!desired.editable)return;const at=position();if(action==='seek'&&(Date.now()<remoteSeekUntil||Math.abs(at-(desired.position||0))<.5))return;if(action==='play'&&desired.playing||action==='pause'&&!desired.playing)return;pendingUntil=Date.now()+800;report(action,{position:at});}
window.canvasApply=s=>{const changed=(s.mediaSession+"/"+s.mediaRevision)!==revision;desired=s;if(changed){revision=s.mediaSession+"/"+s.mediaRevision;pendingUntil=0;}if(!player||Date.now()<pendingUntil)return;try{
 const p=Math.max(0,Number(s.position)||0),volume=Math.max(0,Math.min(1,s.volume??0));
 if(kind==='youtube'&&player.getPlayerState){volume===0?player.mute():player.unMute();player.setVolume(volume*100);if(Math.abs(position()-p)>.5){remoteSeekUntil=Date.now()+600;player.seekTo(p,true);}let current=player.getPlayerState();if(s.playing&&current!==1)player.playVideo();if(!s.playing&&current===1)player.pauseVideo();}
 else if(kind==='video'){player.muted=volume===0;player.volume=volume;if(Number.isFinite(player.duration)&&Math.abs(position()-p)>.5){remoteSeekUntil=Date.now()+600;player.currentTime=Math.min(p,player.duration);}if(s.playing&&player.paused)player.play().catch(e=>report('error',{message:String(e)}));if(!s.playing&&!player.paused)player.pause();}
 }catch(e){report('error',{message:String(e)})}};
if(kind==='youtube'){
 const u=new URL(source);let id=u.hostname==='youtu.be'?u.pathname.slice(1).split('/')[0]:u.searchParams.get('v')||u.pathname.split('/')[2];
 window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{width:'100%',height:'100%',videoId:id,playerVars:{enablejsapi:1,origin:location.origin,playsinline:1},events:{onReady:()=>canvasApply(desired),onStateChange:e=>{if(e.data===1)action('play');else if(e.data===2||e.data===0)action('pause')},onError:e=>report('error',{message:'YouTube '+e.data+' (origem ou incorporação indisponível).'})}})};
 const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>report('error',{message:'API do YouTube indisponível.'});document.head.append(script);
}else{player=document.createElement('video');player.muted=true;player.volume=0;player.src=source;player.controls=true;document.getElementById('player').replaceWith(player);player.addEventListener('play',()=>action('play'));player.addEventListener('pause',()=>action('pause'));player.addEventListener('ended',()=>action('pause'));player.addEventListener('seeked',()=>action('seek'));player.addEventListener('loadedmetadata',()=>canvasApply(desired));player.addEventListener('error',()=>report('error',{message:'Formato de vídeo ou fonte indisponível.'}));}
setInterval(()=>{if(!player)return;const now=Date.now(),p=position();if(kind==='youtube'&&desired.editable&&now<((window.canvasGesture||0)+1500)&&now>remoteSeekUntil&&Math.abs(p-lastPosition-(desired.playing?(now-lastSample)/1000:0))>.8)action('seek');lastPosition=p;lastSample=now;report('telemetry',{position:p,playing:kind==='youtube'?player.getPlayerState?.()===1:!player.paused,ready:kind==='youtube'?!!player.getPlayerState:player.readyState>=2});},250);
</script></body></html>
