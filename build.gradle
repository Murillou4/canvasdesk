plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        canvasdesk {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            vmArg '-Dcanvasdesk.selftest=' + providers.gradleProperty('canvasdesk_selftest').getOrElse('false')
            programArgs '--width', '1280', '--height', '720'
        }
        server {
            programArg 'nogui'
            if(providers.gradleProperty('canvasdesk_dedicated_smoke').isPresent())runDir '.codex-temp/dedicated-smoke'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.create('browser')
dependencies { browserImplementation 'me.friwi:jcefmaven:152.0.6' }
tasks.register('browserJar',Jar) {
    dependsOn tasks.named('browserClasses')
    archiveFileName='canvasdesk-browser.jar'
    destinationDirectory=layout.buildDirectory.dir('browser')
    duplicatesStrategy=DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class':'br.com.murillo.canvasdesk.browser.BrowserWorker' }
    from(sourceSets.browser.output)
    from({ configurations.browserRuntimeClasspath.collect { it.isDirectory()?it:zipTree(it) } })
    from('licenses/browser') { into 'META-INF/canvasdesk-licenses' }
    exclude 'META-INF/*.SF','META-INF/*.RSA','META-INF/*.DSA','module-info.class'
}
processResources { dependsOn tasks.named('browserJar');from(tasks.named('browserJar')) { into 'canvasdesk-browser';rename { 'worker.jar' } } }


fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'canvasdesk-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = false
        username = providers.gradleProperty('canvasdesk_test_role').getOrElse('single') in ['peer','mediaPeer'] ? 'CanvasDeskPeer' : 'CanvasDeskTest'
    }
}
sourceSets.gametest.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.gametest.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
sourceSets.test.compileClasspath += sourceSets.browser.output + sourceSets.browser.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.browser.output + sourceSets.browser.runtimeClasspath
loom.runs.clientGameTest {
    vmArg '-Dcanvasdesk.browserSilent=true'
    vmArg '-Dcanvasdesk.browserProbe=true'
    vmArg '-Xmx2G'
    vmArg '-Dcanvasdesk.selftest=true'
    vmArg '-Dcanvasdesk.nativeInputMode=' + providers.gradleProperty('canvasdesk_native_input_mode').getOrElse('all')
    vmArg '-Dcanvasdesk.probeOutput=' + providers.gradleProperty('canvasdesk_probe_output').getOrElse(layout.projectDirectory.dir('artifacts/1.4.0/smoke').asFile.absolutePath)
    vmArg '-Dcanvasdesk.reportDir=' + layout.projectDirectory.dir('artifacts/runtime').asFile.absolutePath
    vmArg '-Dcanvasdesk.testRole=' + providers.gradleProperty('canvasdesk_test_role').getOrElse('single')
    vmArg '-Dcanvasdesk.projectRoot=' + layout.projectDirectory.asFile.absolutePath
    vmArg '-Dcanvasdesk.browserCache=' + layout.projectDirectory.dir('.codex-temp/browser-native-152').asFile.absolutePath
    vmArg '-Dcanvasdesk.stress=' + providers.gradleProperty('canvasdesk_stress').getOrElse('false')
    if (providers.gradleProperty('canvasdesk_test_role').getOrElse('single') == 'party') {
        runDir '.codex-temp/party-client-150'
    } else if (providers.gradleProperty('canvasdesk_test_role').getOrElse('single') == 'worldMedia') {
        runDir '.codex-temp/world-media-client-141'
    } else if (providers.gradleProperty('canvasdesk_test_role').getOrElse('single') == 'features') {
        runDir '.codex-temp/features-client-140'
    } else if (providers.gradleProperty('canvasdesk_test_role').getOrElse('single') == 'editor') {
        runDir '.codex-temp/editor-client-130'
    } else if (providers.gradleProperty('canvasdesk_test_role').getOrElse('single') == 'interaction') {
        runDir '.codex-temp/interaction-client-121'
    } else if (providers.gradleProperty('canvasdesk_test_role').getOrElse('single') != 'single') {
        runDir '.codex-temp/multiplayer-' + providers.gradleProperty('canvasdesk_test_role').get()
    }
    def testRole=providers.gradleProperty('canvasdesk_test_role').getOrElse('single')
    programArgs '--width', testRole in ['primary','peer','mediaOwner','mediaPeer'] ? '854' : '1280', '--height', testRole in ['primary','peer','mediaOwner','mediaPeer'] ? '480' : '720'
}
loom.runs.register('performanceClient') {
    client()
    source sourceSets.gametest
    runDir '.codex-temp/performance-client'
    vmArg '-Xmx1500M'
    vmArg '-Dcanvasdesk.performanceProbe=true'
    vmArg '-Dcanvasdesk.projectRoot=' + layout.projectDirectory.asFile.absolutePath
    programArgs '--width','854','--height','480','--username','CanvasDeskTest','--quickPlaySingleplayer','CanvasDeskBench'
}
sourceSets.create('serverValidation') {
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}
loom.mods.register('canvasdesk-server-validation') { sourceSet sourceSets.serverValidation }
loom.runs.register('dedicatedValidation') {
    server()
    source sourceSets.serverValidation
    runDir '.codex-temp/dedicated-validation'
    vmArg '-Xmx1500M'
    vmArg '-Dcanvasdesk.projectRoot=' + layout.projectDirectory.asFile.absolutePath
    vmArg '-Dcanvasdesk.serverReload=' + providers.gradleProperty('canvasdesk_server_reload').getOrElse('false')
    programArg 'nogui'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.named('sourcesJar') {
    from(sourceSets.browser.allSource) { into 'browser' }
    from('LICENSE','THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'licenses' }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}
test { useJUnitPlatform(); timeout = java.time.Duration.ofMinutes(2) }
jar { from('LICENSE','THIRD_PARTY_NOTICES.md');from('licenses') { into 'licenses' } }
tasks.named('runServer') { standardInput = System.in }
tasks.register('sourceDistribution', Zip) {
    archiveFileName = "CanvasDesk-${project.version}-source.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(projectDir) {
        include 'gradlew', 'gradlew.bat', 'gradle/**', 'gradle.properties', 'settings.gradle', 'build.gradle'
        include 'src/**', 'tools/**', 'art/**', 'README.md', 'VALIDATION_STATUS.md', 'CONTRACT.md', 'LICENSE', 'AGENTS.md', '.gitignore', 'THIRD_PARTY_NOTICES.md', 'licenses/**'
        exclude '**/__pycache__/**', '**/*.pyc'
    }
}
tasks.register('release', Copy) {
    dependsOn build, sourceDistribution
    into layout.projectDirectory.dir("dist/${project.version}")
    from(tasks.jar.archiveFile)
    from(tasks.sourcesJar.archiveFile)
    from(tasks.sourceDistribution.archiveFile)
    from('README.md','VALIDATION_STATUS.md','CONTRACT.md','THIRD_PARTY_NOTICES.md')
    doLast {
        def entries = destinationDir.listFiles().findAll { it.name.endsWith('.jar') || it.name.endsWith('.zip') }.sort { it.name }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        new File(destinationDir, 'SHA256SUMS.txt').text = entries.collect { f -> digest.digest(f.bytes).encodeHex().toString() + '  ' + f.name }.join('\n') + '\n'
    }
}
